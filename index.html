  /* Design tokens: change a colour or size here and the whole app follows */
  :root {
    /* Palette "Mata e ipê": Amazon green (navigation, walking), Brazil blue (one main button, metro),
       ipê yellow (selected chips, always behind dark text), on warm sand */
    --bg:#F6F4EC; --card:#FFFFFF; --ink:#142218; --muted:#4F5B50; --line:#DDE2D3; --soft:#ECEFE3;
    --accent:#1B6D3F; --on-accent:#FFFFFF; --action:#002776; --on-action:#FFFFFF;
    --hi:#FFCC29; --on-hi:#142218;
    /* spending categories (only used for small dots, bars and icons; text stays ink) */
    --c-food:#1B6D3F; --c-transport:#002776; --c-stay:#1F6F8B; --c-activities:#C99700; --c-shopping:#B85B40; --c-nightlife:#6B3A7D; --c-other:#7C887E;
    --ok-bg:#E2F0E5; --ok-ink:#1B6D3F; --warn:#92400E; --warn-bg:#FEF3C7; --star:#A67C00;
    --nav-h:calc(64px + env(safe-area-inset-bottom)); --radius:16px; --radius-sm:10px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --tap:44px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0F1712; --card:#18221B; --ink:#E9F0E8; --muted:#A7B5A8; --line:#2B382E; --soft:#223026;
      --accent:#5CC98A; --on-accent:#06210F; --action:#7FA2F5; --on-action:#071433;
      --hi:#F2C230; --on-hi:#142218;
      --c-food:#5CC98A; --c-transport:#7FA2F5; --c-stay:#7CC6DE; --c-activities:#F2C230; --c-shopping:#E08A6D; --c-nightlife:#C49AD6; --c-other:#8E9B90;
      --ok-bg:#183A26; --ok-ink:#7FDCA3; --warn:#FBBF24; --warn-bg:#33270B; --star:#F2C230;
    }
  }
  * { box-sizing:border-box; }
  /* the app redraws the page on every tap; the browser's scroll anchoring then guessed wrong and moved the page */
  html, body, main { overflow-anchor:none; }
  body { margin:0; font:16px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
  button, input, select, textarea { font-family:inherit; }
  header { padding:var(--s4) var(--s4) var(--s2); padding-top:calc(var(--s4) + env(safe-area-inset-top)); }
  header h1 { margin:0; font-size:22px; font-weight:800; letter-spacing:-.01em; }
  header small { color:var(--muted); }
  main { padding:var(--s2) var(--s4) 100px; max-width:640px; margin:0 auto; }
  nav { position:fixed; z-index:50; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line);
        padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; background:none; height:64px; padding:var(--s2) 0; font-size:12px; font-weight:600; color:var(--muted); }
  nav button .ic { display:flex; justify-content:center; margin-bottom:2px; }
  nav button svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  nav button.on svg { stroke-width:2.4; }
  header[hidden] { display:none; }
  nav button.on { color:var(--accent); font-weight:800; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:var(--s4); margin:var(--s3) 0; }
  .row { display:flex; align-items:center; gap:var(--s2); }
  .grow { flex:1; min-width:0; }
  .muted { color:var(--muted); font-size:14px; }
  .chips { display:flex; gap:var(--s2); flex-wrap:wrap; margin:var(--s2) 0; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:var(--s2) 14px; min-height:var(--tap); font-size:14px; font-weight:600; }
  .chip.on { background:var(--hi); color:var(--on-hi); border-color:var(--hi); font-weight:700; }
  .star { border:0; background:none; font-size:26px; color:var(--muted); min-width:var(--tap); min-height:var(--tap); padding:var(--s1); }
  .star.on { color:var(--star); }
  input, select { font:inherit; padding:var(--s3); min-height:var(--tap); border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--bg); color:var(--ink); width:100%; }
  input[type=checkbox] { width:24px; height:24px; min-height:0; flex:none; accent-color:var(--accent); }
  .btn { display:inline-flex; align-items:center; justify-content:center; text-decoration:none; background:var(--accent); color:var(--on-accent); border:0; border-radius:12px; padding:var(--s3) var(--s4); min-height:var(--tap); font:inherit; font-weight:700; }
  .btn.act { background:var(--action); color:var(--on-action); }
  button.ghost, a.ghost, label.ghost { display:inline-flex; align-items:center; background:none; border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:var(--s2) var(--s3); min-height:var(--tap); font:inherit; font-size:14px; font-weight:600; }
  button.x { background:none; border:0; color:var(--muted); font-size:22px; min-width:var(--tap); min-height:var(--tap); padding:var(--s1) var(--s2); }
  .big { font-size:32px; font-weight:800; letter-spacing:-.02em; }
  .neg { color:var(--warn); }
  .tag { font-size:12px; font-weight:700; border-radius:6px; padding:3px 8px; background:var(--soft); color:var(--muted); }
  .booked { background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-bg); }
  .done .t { text-decoration:line-through; color:var(--muted); }
  h2 { font-size:18px; font-weight:800; margin:var(--s5) 0 var(--s1); }
  h3 { font-weight:800; }
  .place { cursor:pointer; }
  .ico { font-size:30px; width:44px; text-align:center; }
  .blurb { margin-top:var(--s1); }
  .hero { height:200px; border-radius:var(--radius); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:72px;
          background:var(--soft); }
  .hero img { width:100%; height:100%; object-fit:cover; }
  .title { font-size:24px; font-weight:800; letter-spacing:-.01em; margin:var(--s3) 0 var(--s1); }
  .li { padding:3px 0; }
  .warn { background:var(--warn-bg); color:var(--warn); border-color:var(--warn); }

  .filterbar { display:flex; align-items:center; gap:var(--s2); margin:var(--s2) 0; }
  .filterbar .chips { margin:0; flex:1; min-width:0; }
  .chips.nowrap { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  .chips.nowrap .chip { white-space:nowrap; }
  .filterbtn { gap:6px; flex:none; }
  .filterbtn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
  .badge { background:var(--action); color:var(--on-action); font-size:12px; font-weight:800; border-radius:999px; min-width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; padding:0 6px; }
  .backdrop { position:fixed; inset:0; background:rgba(14,22,20,.5); z-index:60; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:70; background:var(--card); border-radius:20px 20px 0 0; padding:var(--s2) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom)); max-height:80vh; overflow:auto; max-width:640px; margin:0 auto; box-shadow:0 -4px 20px rgba(0,0,0,.2); }
  .grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto var(--s2); }
  .pc { display:flex; padding:0; overflow:hidden; min-height:132px; }
  .thumb { width:104px; flex:none; position:relative; display:flex; align-items:center; justify-content:center; background:var(--soft) center/cover no-repeat; color:var(--accent); }
  .thumb .cat-ic { width:36px; height:36px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .thumb.has .cat-ic { display:none; }
  .num { position:absolute; left:8px; top:8px; width:24px; height:24px; border-radius:50%; background:var(--ink); color:var(--bg); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .pc-body { flex:1; min-width:0; padding:var(--s3) var(--s3) var(--s3) var(--s3); display:flex; flex-direction:column; gap:2px; }
  .pc-name { font-size:16px; line-height:1.25; }
  .pc-area { font-size:13px; }
  .pc-short { font-size:14px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:2px; }
  .pc-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .star.sm { min-width:var(--tap); min-height:var(--tap); font-size:22px; margin:-10px -10px -4px 0; }
  .tag.warnTag { background:var(--warn-bg); color:var(--warn); }
  .herowrap { position:relative; margin:0 calc(-1 * var(--s4)); }
  .herowrap .hero { height:240px; border-radius:0 0 20px 20px; color:var(--accent); }

<script>
/* ============ 1. THE DATA ============
   Everything you enter lives in one object called "state".
   It is saved on your phone (localStorage) after every change, so it works offline. */

const DEFAULT_STATE = {
  rate: 750,            // COP per 1 BRL. CHANGE THIS to today's rate in the Budget tab.
  daily: 300,           // daily allowance in BRL
  startDate: '2026-11-14',
  numDays: 11,
  saved: {},            // {placeId: true}
  notes: {},            // {placeId: 'my notes'}
  customActs: [],       // activities you add yourself
  plan: {},             // {'2026-11-14': [{id, actId, text, done, booked, status, docId}]}  status: idea | booked | cancelled
  expenses: [],         // [{id, date, amt, note}]
  docs: [
    {id:'d1', type:'id', f:{}, title:'Passport', conf:'', notes:'', checks:[{t:'Valid 6+ months after trip',d:false},{t:'Photo of passport page saved offline',d:false}]},
    {id:'d2', type:'flight', f:{}, title:'Flights', conf:'', notes:'', checks:[{t:'Check-in opened',d:false},{t:'Return flight confirmed',d:false}]},
    {id:'d3', type:'stay', f:{}, title:'Airbnb São Paulo', conf:'', notes:'', checks:[{t:'Confirmed',d:true},{t:'Address saved offline',d:false},{t:'Check-in instructions saved',d:false}]},
    {id:'d4', type:'stay', f:{}, title:'Airbnb Rio', conf:'', notes:'', checks:[{t:'Booked',d:false},{t:'Address saved offline',d:false}]},
    {id:'d5', type:'bus', f:{}, title:'Buses (Tietê ↔ Rio)', conf:'', notes:'', checks:[{t:'Outbound ticket',d:false},{t:'Return ticket',d:false}]},
  ],
};

const OLD_IDS = {sp1:'masp', sp2:'ibirapuera', sp3:'beco', sp4:'mercado', sp5:'liberdade', sp6:'terraco', sp7:'pinacoteca',
                 rj1:'cristo', rj2:'pao', rj3:'arpoador', rj4:'selaron', rj5:'lapa', rj7:'jbrj'};
let state = load();
let tab = 'explore';
let ui = { daySheet:false, sheet:false, draft:null, planView:'timeline', city:'All', cat:'all', mode:'any', planDay:null, detail:null, scroll:0, msg:'' };

function load() {
  let st = structuredClone(DEFAULT_STATE);
  try {
    const raw = localStorage.getItem('trip-state-v1');
    if (raw) st = Object.assign(st, JSON.parse(raw));
  } catch (e) {}
  // carry stars and plan items from the first version's ids over to the new place ids
  for (const [o, n] of Object.entries(OLD_IDS)) if (st.saved[o]) { st.saved[n] = true; delete st.saved[o]; }
  for (const d of Object.keys(st.plan)) st.plan[d].forEach(i => { if (OLD_IDS[i.actId]) i.actId = OLD_IDS[i.actId]; });
  // document cards made before booking types: guess a type from the title, keep everything else
  st.docs.forEach(d => { if (!d.type) d.type = guessDocType(d.title || ''); if (!d.f) d.f = {}; if (!d.checks) d.checks = []; });
  return st;
}
function save() { try { localStorage.setItem('trip-state-v1', JSON.stringify(state)); } catch (e) {} }
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n).toLocaleString('es-CO', {maximumFractionDigits:0});
const brl = n => 'R$ ' + Number(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});

function tripDays() {
  const out = [], d = new Date(state.startDate + 'T12:00:00');
  for (let i = 0; i < state.numDays; i++) { out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return out;
}
function dayLabel(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}
const customToPlace = c => ({id:c.id, city:c.city, ico:'📍', name:c.name, fullName:c.name, area:'', address:'', short:c.note||'', hoursShort:'',
  hours:[], price:'', acts:[], transit:null, link:'', eve:c.when==='evening', wknd:c.when==='weekend', free:false, custom:true});
const allActs = () => PLACES.concat(state.customActs.map(customToPlace));
const actById = id => allActs().find(a => a.id === id);

/* ============ 2. THE SCREENS ============
   Each tab has a function that builds its HTML. render() redraws the current tab. */

const CAT_LABEL = {'museum':'Museum','monument/architecture':'Monument','neighborhood/culture':'Neighborhood','park/view':'Park or view','nightlife/music':'Nightlife','day trip':'Day trip','experience':'Experience'};
const CAT_PATH = {
  'museum':'<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
  'monument/architecture':'<path d="M6 21V9l6-6 6 6v12M3 21h18M10 21v-5h4v5"/>',
  'neighborhood/culture':'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  'park/view':'<path d="M12 21v-6M12 3c4 0 6 3 6 6 0 3-2 5-6 6-4-1-6-3-6-6 0-3 2-6 6-6z"/>',
  'nightlife/music':'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  'day trip':'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/>',
  'experience':'<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/>'
};
const catIcon = c => `<svg class="cat-ic" viewBox="0 0 24 24" aria-hidden="true">${CAT_PATH[c] || '<circle cx="12" cy="12" r="8"/>'}</svg>`;
function cardStation(a) {
  const t = a.transit && a.transit.station; if (!t || /^no\b|bus/i.test(t)) return '';
  const first = t.split(/ or |;|\(|,/)[0].trim();
  return first && first.length <= 24 ? 'Metro ' + first : '';
}
async function loadCardPhotos() {
  for (const el of document.querySelectorAll('[data-thumb]')) {
    const arr = await photosGet(el.dataset.thumb);
    if (arr && arr[0] && el.isConnected) { el.style.backgroundImage = `url(${arr[0]})`; el.classList.add('has'); }
  }
}
function previewCount(d) {
  let l = allActs().filter(a => ui.city === 'All' || a.city === ui.city);
  if (d.cat !== 'all') l = l.filter(a => a.cat === d.cat);
  if (d.mode === 'eve') l = l.filter(a => a.eve);
  if (d.mode === 'wknd') l = l.filter(a => a.wknd);
  return l.length;
}
function renderExplore() {
  if (ui.detail) {
    const p = actById(ui.detail);
    if (p) return renderDetail(p);
    ui.detail = null;
  }
  const cities = ['All', 'São Paulo', 'Rio de Janeiro'];
  const modes = [['any','Any time'], ['eve','After work'], ['wknd','Weekend days']];
  let list = allActs().filter(a => ui.city === 'All' || a.city === ui.city);
  if (ui.cat !== 'all') list = list.filter(a => a.cat === ui.cat);
  if (ui.mode === 'eve') list = list.filter(a => a.eve);
  if (ui.mode === 'wknd') list = list.filter(a => a.wknd);
  const chips = cities.map(c => `<button class="chip ${ui.city===c?'on':''}" data-act="city" data-v="${c}">${c === 'Rio de Janeiro' ? 'Rio' : c}</button>`).join('');
  const CATS = [['all','All types'],['museum','Museums'],['monument/architecture','Monuments'],['neighborhood/culture','Neighborhoods'],['park/view','Parks & views'],['nightlife/music','Nightlife & music'],['day trip','Day trips'],['experience','Experiences']];
  const dr = ui.draft || {mode: ui.mode, cat: ui.cat};
  const chips3 = CATS.map(([k,l]) => `<button class="chip ${dr.cat===k?'on':''}" data-act="draftCat" data-v="${k}">${l}</button>`).join('');
  const chips2 = modes.map(([k,l]) => `<button class="chip ${dr.mode===k?'on':''}" data-act="draftMode" data-v="${k}">${l}</button>`).join('');
  const nFilters = (ui.mode !== 'any' ? 1 : 0) + (ui.cat !== 'all' ? 1 : 0);
  const summary = [ui.mode !== 'any' ? modes.find(m => m[0] === ui.mode)[1] : '', ui.cat !== 'all' ? CATS.find(c => c[0] === ui.cat)[1] : ''].filter(Boolean).join(' · ');
  const sheet = ui.sheet ? `<div class="backdrop" data-act="closeSheet"></div>
    <div class="sheet" role="dialog" aria-label="Filters">
      <div class="grab"></div>
      <div class="row"><h3 class="grow" style="margin:0;font-size:18px">Filters</h3><button class="x" data-act="closeSheet" aria-label="Close">×</button></div>
      <div class="muted" style="margin-top:12px"><b>When</b></div><div class="chips">${chips2}</div>
      <div class="muted" style="margin-top:8px"><b>Type</b></div><div class="chips">${chips3}</div>
      <div class="row" style="margin-top:16px"><button class="ghost" data-act="clearFilters">Clear</button><span class="grow"></span><button class="btn" data-act="applyFilters">Show ${previewCount(dr)} places</button></div>
    </div>` : '';
  const cards = list.map((a, i) => {
    const st = cardStation(a);
    return `
    <div class="card place pc" data-act="open" data-id="${a.id}">
      <div class="thumb" data-thumb="${a.id}">${catIcon(a.cat)}<span class="num">${i + 1}</span></div>
      <div class="pc-body">
        <div class="row" style="align-items:flex-start;gap:4px">
          <b class="grow pc-name">${esc(a.name)}</b>
          <button class="star sm ${state.saved[a.id]?'on':''}" data-act="star" data-id="${a.id}" aria-label="Save ${esc(a.name)}" aria-pressed="${!!state.saved[a.id]}">${state.saved[a.id]?'★':'☆'}</button>
        </div>
        <div class="muted pc-area">${esc(a.area || a.city)}${a.area ? ' · ' + (a.city === 'Rio de Janeiro' ? 'Rio' : 'SP') : ''}</div>
        ${a.short ? `<div class="pc-short">${esc(a.short)}</div>` : ''}
        <div class="pc-tags">${a.cat?`<span class="tag">${esc(CAT_LABEL[a.cat] || a.cat)}</span>`:''}${a.free?'<span class="tag">Free</span>':''}${st?`<span class="tag">${esc(st)}</span>`:''}${a.eve?'<span class="tag">After work</span>':''}${a.wknd?'<span class="tag">Weekend</span>':''}${a.check?'<span class="tag warnTag">Check hours</span>':''}</div>
      </div>
    </div>`; }).join('') || '<p class="muted">Nothing matches this filter.</p>';
  setTimeout(loadCardPhotos, 0);

  return `<div class="filterbar"><div class="chips nowrap">${chips}</div>
      <button class="ghost filterbtn" data-act="openSheet" aria-label="Filters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Filters${nFilters ? `<span class="badge">${nFilters}</span>` : ''}</button></div>
    ${summary ? `<div class="muted" style="margin:0 4px 4px">${esc(summary)}</div>` : ''}
    <div class="muted" style="margin:0 4px">${list.length} place${list.length===1?'':'s'} · tap one for the full page</div>
    ${cards}
    <div class="card"><b>Add your own idea</b>
      <div class="grid2" style="margin-top:8px">
        <input id="newActName" placeholder="Name">
        <select id="newActCity"><option>São Paulo</option><option>Rio de Janeiro</option></select>
      </div>
      <div class="row" style="margin-top:8px"><select id="newActWhen"><option value="any">Any time</option><option value="evening">Evening</option><option value="weekend">Weekend</option></select>
      <button class="btn" data-act="addCustomAct">Add</button></div></div>
    <div class="card"><b class="row">${ic('img')}Photos</b>
      <div class="muted">On a computer or phone with internet: fetch free photos (Wikimedia Commons) for every place. To move them to another device, export a photo pack and import it there.</div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap">
        <button class="btn" data-act="fetchAll">Get photos for all places</button>

/* ---- photos: stored in the phone's IndexedDB (bigger than normal storage) ---- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('trip-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function photosGet(id) {
  try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('photos').objectStore('photos').get(id); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); }); }
  catch (e) { return []; }
}
async function photosSet(id, arr) {
  const db = await idb();
  return new Promise((res, rej) => { const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').put(arr, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
function fileToDataUrl(file, max = 1200) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = rej; img.src = url;
  });
}
async function refreshPhotos() {

  refreshPhotos();
}

async function creditsGet(id) { const r = await photosGet('credit:' + id); return Array.isArray(r) ? r : []; }
// Better Commons searches for places whose own query (a.q) found wrong or no pictures. Tested live, Oct 2026.
// intitle:"..." means the file name must contain those words.
const PHOTO_Q = {
  terraco: ['intitle:"Terraço Itália"', 'intitle:"Edifício Itália"'],
  farol: ['intitle:"Altino Arantes"', 'intitle:"Farol Santander"'],
  paulista: ['intitle:"Avenida Paulista" domingo'],
  estaiada: ['intitle:"Ponte Octávio Frias de Oliveira"'],
  calixto: ['"Feira Benedito Calixto"', 'intitle:"Praça Benedito Calixto"'],
  bauxoaugusta: ['intitle:"Rua Augusta" "São Paulo"'],
  santos: ['intitle:"Bolsa do Café" Santos', 'intitle:"Praia de Santos"'],
  futebolmatch: ['intitle:"Allianz Parque" Palmeiras', 'intitle:"Pacaembu" estádio'],
  sesc: ['intitle:"SESC Pompeia" -Linha -Metro'],
  casafrancisca: ['intitle:"Casa de Francisca" -Herrera -Masana'],
  jbsp: ['intitle:"Jardim Botânico de São Paulo"'],
  cristo: ['intitle:"Christ the Redeemer" Rio', 'intitle:"Cristo Redentor" Corcovado'],
  cariocagema: ['intitle:"Carioca da Gema" Lapa', 'intitle:"Rua do Lavradio"'],
  hippie: ['intitle:"Praça General Osório" "Rio de Janeiro"'],
  santateresa: ['intitle:"Santa Teresa" bonde', 'intitle:"Parque das Ruínas"'],
  saobentorio: ['intitle:"Mosteiro de São Bento (Rio de Janeiro)"', 'intitle:"Mosteiro de São Bento" Rio -Paulo'],
  jbrj: ['intitle:"Jardim Botânico do Rio de Janeiro" -Archivos'],
  maracana: ['intitle:"Maracanã" estádio'],
  praias: ['intitle:"Praia de Ipanema" "Rio de Janeiro"', 'intitle:"Praia de Copacabana" -Maratona']
};
// File names that point to the wrong city, or to logos and maps rather than photos
const PHOTO_WRONG_CITY = {'São Paulo': /rio de janeiro|curitiba|lisbo/i, 'Rio de Janeiro': /s[aã]o paulo|curitiba|porto alegre|lisbo/i};
const PHOTO_SKIP = /\blogo\b|\bmapa?\b|diagram/i;
const PHOTO_NONE = new Set(['oborogodo']);   // Commons has no real photo of these; add your own instead
const PHOTO_GENERIC = new Set(['sao', 'paulo', 'rio', 'janeiro', 'parque', 'museu', 'praca', 'rua', 'avenida', 'the', 'and', 'with']);
const fold = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const WIKI_HEADERS = {'Api-User-Agent': 'BrazilTripPWA/1.0 (personal trip planner, low volume)'};
// fetch that gives up after `ms`, so one stuck download can't freeze "Get photos for all places"
async function fetchT(url, how, opts = {}, ms = 20000) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  try { const r = await fetch(url, {...opts, signal: ac.signal}); if (!r.ok) throw new Error(r.status); return await r[how](); }
  finally { clearTimeout(t); }
}
async function fetchPlacePhotos(a, onStatus) {
  const have = await photosGet(a.id);
  if (have.length >= 3 || PHOTO_NONE.has(a.id)) return 0;
  const plain =s => (s || '').replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
  const queries = [...(PHOTO_Q[a.id] || []), a.q, plain(a.name) + ' ' + a.city, plain(a.fullName || a.name)].filter(Boolean);
  // words from the place name; photos whose file name contains them are tried first
  const words = fold(a.name).split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !PHOTO_GENERIC.has(w));
  const score = t => words.filter(w => fold(t).includes(w)).length;
  const wrongCity = PHOTO_WRONG_CITY[a.city];
  let hits = [];
  for (const q of [...new Set(queries)]) {
    const url = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=15&gsrsearch=' + encodeURIComponent(q) +
      '&prop=imageinfo&iiprop=url|mime|extmetadata&iiurlwidth=1200&format=json&origin=*';
    try {
      const j = await fetchT(url, 'json', {headers: WIKI_HEADERS});
      const pages = Object.values((j.query && j.query.pages) || {}).sort((x, y) => x.index - y.index)
        .filter(p => !PHOTO_SKIP.test(p.title) && !(wrongCity && wrongCity.test(p.title)));
      pages.forEach(p => p.s = score(p.title));
      pages.sort((x, y) => y.s - x.s);   // stable: keeps Commons' order among equals
      hits = pages.map(p => p.imageinfo && p.imageinfo[0]).filter(i => i && /^image\/(jpeg|png)$/.test(i.mime) && i.thumburl);
    } catch (e) { throw new Error('offline'); }
    if (hits.length) break;
  }
  const strip = h => (h || '').replace(/<[^>]*>/g, '').trim();
  const credits = await creditsGet(a.id);
  let added = 0, fails = 0;
  photoStalled = false;
  for (const i of hits) {
    if (have.length >= 3) break;
    if (fails >= 2) { photoStalled = true; break; }   // image server is stuck or slow: move on to the next place
    try {
      const blob = await fetchT(i.thumburl, 'blob');
      have.push(await fileToDataUrl(blob));
      const m = i.extmetadata || {};
      credits.push(strip(m.Artist && m.Artist.value).slice(0, 60) + ' · ' + strip(m.LicenseShortName && m.LicenseShortName.value) + ' · Wikimedia Commons');
      added++; fails = 0;
    } catch (e) { fails++; }
  }
  if (added) { await photosSet(a.id, have); await photosSet('credit:' + a.id, credits); }
  return added;
}
let photoStalled = false;   // set when the last place gave up on slow downloads
async function fetchAllPhotos(btn) {
  const list = allActs(); let n = 0, got = 0, none = [], slow = [];
  try {
    for (const a of list) {
      n++; btn.textContent = `Fetching ${n}/${list.length}…`;
      const k = await fetchPlacePhotos(a);
      if (k) got++;
      if (photoStalled) slow.push(a.name);
      else if (!k && !(await photosGet(a.id)).length) none.push(a.name);
      if (k) await new Promise(r => setTimeout(r, 500));   // be gentle with Wikimedia
    }
    btn.textContent = `Done: ${got} places got photos`;
    alert(`Photos added for ${got} places.` + (none.length ? `\n\nNo photo found for: ${none.join(', ')}` : '') +
      (slow.length ? `\n\nDownloads were too slow for: ${slow.join(', ')}. Tap the button again later to retry.` : ''));
  } catch (e) { btn.textContent = 'No internet. Try again when online.'; }
}
async function exportPhotos() {
  const db = await idb();
  const all = await new Promise((res, rej) => { const o = {}; const q = db.transaction('photos').objectStore('photos').openCursor();
    q.onsuccess = () => { const c = q.result; if (c) { o[c.key] = c.value; c.continue(); } else res(o); }; q.onerror = () => rej(q.error); });
  const blob = new Blob([JSON.stringify({trip: 1, data: all})], {type: 'application/json'});

}
async function importPhotos(file) {
  try {
    const j = JSON.parse(await file.text()); let n = 0;
    for (const [k, v] of Object.entries(j.data || {})) {

      await photosSet(k, merged); if (!k.startsWith('credit:')) n++;
    }
    alert(`Imported photos for ${n} places.`); render();
  } catch (e) { alert('That file could not be read.'); }
}

// On a phone, open the share sheet (save to Files or Drive, email it); elsewhere, download
function saveFile(name, text, type) {

  if (/Android|iPhone|iPad|Mobi/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files: [file]}))
    return navigator.share({files: [file], title: name}).catch(() => {});

  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function expensesCsv() {
  const q = v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['Date', 'Prepaid', 'Category', 'What', 'Amount', 'Currency', 'R$', 'COP', 'Paid with', 'COP with card fee', 'Spread part'];
  const rows = state.expenses.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(e => [
    e.date || '', e.prepaid ? 'yes' : '', catOf(e)[1], e.note || '', e.cur === 'COP' ? e.cop : e.amt, e.cur === 'COP' ? 'COP' : 'BRL',
    expBRL(e).toFixed(2), Math.round(expCOP(e)), PAY_LABEL[e.pay] || '', withFee(e) > 1 ? Math.round(expCOP(e) * withFee(e)) : '', e.group ? `${e.part} of ${e.parts}` : '']);
  return '﻿' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n');   // BOM so spreadsheets read accents correctly
}
async function makeBackup(withPhotos) {
  state.lastBackup = brazilToday(); save();
  const out = {app: 'brazil-trip', version: 1, exported: new Date().toISOString(), state,
    coords: JSON.parse(localStorage.getItem('trip-coords-v1') || '{}'), routes: JSON.parse(localStorage.getItem('trip-routes-v1') || '{}')};

      <div class="muted">Plans, budget, documents and notes live only in this browser. Save a backup file now and then, and before you fly.</div></div></div>
    <div class="lastbk ${stale ? 'stale' : ''}">${last ? `Last backup: ${shortDate(last)}${age > 0 ? ` (${age} day${age === 1 ? '' : 's'} ago)` : ' (today)'}` : 'No backup yet'}</div>
    ${ui.backupMsg ? `<div class="muted" role="status" style="margin-top:var(--s2)">${esc(ui.backupMsg)}</div>` : ''}
    <label class="check" style="border-top:0"><input type="checkbox" id="bkPhotos"><span>Include place photos <span class="muted">(much bigger file; ticket files are always included)</span></span></label>
    <div class="row" style="flex-wrap:wrap;margin-top:var(--s1)">
      <button class="ghost" data-act="backup">Save backup file</button>
      <label class="ghost" style="cursor:pointer">Restore from a backup<input type="file" accept=".json,application/json" hidden data-act="restoreFile"></label>
    </div>
    <div class="muted" style="margin-top:var(--s2)">On a phone this opens the share menu: save it to Files or Google Drive, or email it to yourself. Restoring replaces what's in the app now.</div>
  </div>`;
}
function renderDocs() {
  const usedIn = d => { const u = docUses(d.id); return u.length ? `<div class="ilabel" style="margin-top:var(--s2)">Used in your plan</div>
      <div class="chips">${u.map(x => `<button class="chip" data-act="goPlanDay" data-v="${x.date}">${dayLabel(x.date)} · ${esc(itemName(x.it))}</button>`).join('')}</div>` : ''; };
  const cardOf = d => {
    const done = d.checks.filter(c => c.d).length, T = docType(d), sum = docSummary(d);
    return `<div class="card doc" id="doc-${d.id}">
      <div class="doc-h"><span class="doc-ic">${ic(T.icon)}</span>
        <div class="grow"><b>${esc(d.title)}</b><div class="muted">${T.label}${sum ? ' · ' + esc(sum) : ''}</div></div>
        ${d.conf ? '<span class="tag okTag">Booked</span>' : ''}
        <button class="ghost" data-act="editDoc" data-id="${d.id}" aria-label="Edit ${esc(d.title)}">Edit</button></div>
      ${docFields(d) ? `<div class="kvs">${docFields(d)}</div>` : `<button class="addinfo" data-act="editDoc" data-id="${d.id}">${ic('note')}Add the ${T.label.toLowerCase()} details</button>`}
      ${idBanner(d)}
      ${docActions(d)}
      ${d.notes ? `<div class="docnotes">${esc(d.notes)}</div>` : ''}
      ${T.code ? `<label class="ilabel" for="conf-${d.id}">${T.code}</label>
      <div class="copyfield">
        <input id="conf-${d.id}" placeholder="Add it here" value="${esc(d.conf)}" data-act="setConf" data-id="${d.id}" autocomplete="off" spellcheck="false">
        <button data-act="copy" data-id="${d.id}" aria-label="Copy ${T.code.toLowerCase()} for ${esc(d.title)}">${ic('copy')}<span>Copy</span></button>
      </div>` : ''}
      <div class="row" style="margin-top:var(--s3)"><b class="grow" style="font-size:14px">Tickets and files</b></div>
      <div class="atts" data-docatt="${d.id}"></div>
      <label class="ghost addatt">${ic('img')}Add ticket, screenshot or PDF<input type="file" accept="image/*,application/pdf" multiple hidden data-act="docFiles" data-id="${d.id}"></label>
      ${usedIn(d)}
      <div class="row" style="margin-top:var(--s3)"><b class="grow" style="font-size:14px">Checklist</b>${d.checks.length ? `<span class="muted">${done} of ${d.checks.length} done</span>` : ''}</div>
      <div class="checks">${d.checks.map((c,i) => `<label class="check ${c.d?'done':''}"><input type="checkbox" ${c.d?'checked':''} data-act="toggleCheck" data-id="${d.id}" data-i="${i}"><span class="t">${esc(c.t)}</span></label>`).join('')
        || '<div class="muted" style="padding:var(--s2) 0">No checklist yet. Add the things to sort out before you go.</div>'}</div>
      <div class="row addrow"><input placeholder="Add a checklist item" id="chk-${d.id}" aria-label="New checklist item for ${esc(d.title)}"><button class="ghost" data-act="addCheck" data-id="${d.id}">Add</button></div>
    </div>`;
  };
  // group by the day of each booking's first moment, in time order; then documents; then undated
  const first = d => docMoments(d)[0];
  const dated = state.docs.filter(first).sort((a, b) => (first(a).date + (first(a).time || '99')).localeCompare(first(b).date + (first(b).time || '99')));
  const days = [...new Set(dated.map(d => first(d).date))];
  const docsOnly = state.docs.filter(d => !first(d) && (d.type === 'id' || d.type === 'insurance'));
  const undated = state.docs.filter(d => !first(d) && d.type !== 'id' && d.type !== 'insurance');
  const section = (title, list, note) => list.length ? `<h3 class="dochead">${title}${note ? `<span class="muted">${note}</span>` : ''}</h3>${list.map(cardOf).join('')}` : '';
  const cards = days.map(day => section(dayLabel(day), dated.filter(d => first(d).date === day), day === brazilToday() ? 'Today' : '')).join('')
    + section('Documents', docsOnly) + section('No date yet', undated, 'add a date with Edit');
  const empty = `<div class="card empty big-empty">${ic('note')}<div><b>No documents yet</b>
    <div class="muted">Add your flights, stays and bus tickets so their confirmation numbers are one tap away, even offline.</div></div></div>`;
  const idAlerts = state.docs.filter(d => { const s = idStatus(d); return s && (s.level === 'bad' || s.level === 'warn'); })
    .map(d => `<button class="idstat ${idStatus(d).level} top" data-act="jumpDoc" data-id="${d.id}">${ic('warn')}<span><b>${esc(d.title)}</b> · ${esc(idStatus(d).msg)}</span></button>`).join('');
  return idAlerts + renderEmergency() + renderNextUp() + (cards || empty) + `<div class="card"><b>Add a booking or document</b>
      <div class="grid2" style="margin-top:var(--s2)">
        <label class="muted">Name<input id="newDoc" placeholder="Travel insurance"></label>
        <label class="muted">Type<select id="newDocType">${Object.entries(DOC_TYPES).map(([k, t]) => `<option value="${k}">${t.label}</option>`).join('')}</select></label>
      </div>
      <button class="btn act wide" data-act="addDoc">Add and fill in details</button></div>
    <p class="muted">Everything here is stored only on this phone. Confirmation codes are fine; skip passport numbers if you'd rather not keep them here.</p>
    ${renderBackupCard()}`;
}

function render() {
  if (tab !== 'explore') { ui.sheet = false; ui.draft = null; }
  if (!(tab === 'explore' && ui.detail)) ui.daySheet = false;
  const fn = {explore:renderExplore, budget:renderBudget, plan:renderPlan, docs:renderDocs}[tab];
  document.getElementById('main').innerHTML = fn() + (tab === 'plan' ? renderDocSheet() + renderTimeSheet() : '') + (tab === 'budget' ? renderToast() : '') + (tab === 'docs' ? renderDocEdit() + renderEmEdit() : '');
  if (tab === 'budget') expPreview();
  if (tab === 'docs' || tab === 'plan') loadDocAtts();
  if (tab === 'explore' && ui.detail) refreshPhotos();
  // centre the chosen day chip by scrolling the chip row sideways only (scrollIntoView also scrolled the page up)
  if (tab === 'plan' || tab === 'budget') { const c = document.querySelector('#daychips .chip.on'), row = document.getElementById('daychips');
    if (c && row) row.scrollLeft = c.offsetLeft - row.offsetLeft - (row.clientWidth - c.offsetWidth) / 2; }
  if (tab === 'plan' && document.getElementById('map')) initMap(); else if (leafMap) { try { leafMap.remove(); } catch (e) {} leafMap = null; }
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const days = tripDays();
  const titles = {explore:'Explore', budget:'Budget', plan:'Plan', docs:'Docs'};
  document.getElementById('title').textContent = titles[tab];
  const sub = document.getElementById('sub');
  sub.textContent = tab === 'explore' ? `Brazil trip · ${dayLabel(days[0])} → ${dayLabel(days[days.length-1])}` : '';
  sub.style.display = sub.textContent ? '' : 'none';
  document.getElementById('hdr').hidden = (tab === 'explore' && !!ui.detail);
}

/* ============ 3. THE BUTTONS ============
   One listener catches every tap and checks which "data-act" it was. */

document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab;
  if (ui.detail) { ui.detail = null; history.back(); }
  render(); window.scrollTo(0, 0);
});

function findPlanItem(id) { return (state.plan[ui.planDay] || []).find(i => i.id === id); }
function addPlan(item) { (state.plan[ui.planDay] ||= []).push(Object.assign({id:uid(), done:false, booked:false}, item)); }

const actions = {
  openDaySheet: () => { ui.daySheet = true; },
  closeDaySheet: () => { ui.daySheet = false; },
  pickDay: t => {
    const date = t.dataset.v, id = t.dataset.id;
    (state.plan[date] ||= []).push({id:uid(), actId:id, done:false, booked:false});
    state.saved[id] = true; ui.msg = 'Added to ' + dayLabel(date) + ' in your Plan'; ui.daySheet = false;
  },
  openSheet: () => { ui.draft = {mode: ui.mode, cat: ui.cat}; ui.sheet = true; },
  closeSheet: () => { ui.sheet = false; ui.draft = null; },
  draftMode: t => { ui.draft = Object.assign({mode: ui.mode, cat: ui.cat}, ui.draft, {mode: t.dataset.v}); },
  draftCat: t => { ui.draft = Object.assign({mode: ui.mode, cat: ui.cat}, ui.draft, {cat: t.dataset.v}); },
  clearFilters: () => { ui.draft = {mode: 'any', cat: 'all'}; },
  applyFilters: () => { if (ui.draft) { ui.mode = ui.draft.mode; ui.cat = ui.draft.cat; } ui.sheet = false; ui.draft = null; },
  planView: t => { ui.planView = t.dataset.v; },
  toggleWork: () => { (state.workOverride ||= {})[ui.planDay] = !workOn(ui.planDay); },
  autoArrange: () => { const left = autoArrange(ui.planDay); if (left) alert(left + ' item(s) did not fit around your work block. Try a weekend day or set a time by hand.'); },
  openTime: t => { ui.timeSheet = t.dataset.id; },
  closeTime: () => { ui.timeSheet = null; },
  setHour: t => { const i = findPlanItem(ui.timeSheet); if (!i) return false; const m = i.start ? i.start.split(':')[1] : '00'; i.start = String(t.dataset.v).padStart(2, '0') + ':' + m; },
  setMinute: t => { const i = findPlanItem(ui.timeSheet); if (!i) return false; const h = i.start ? i.start.split(':')[0] : '18'; i.start = h + ':' + String(t.dataset.v).padStart(2, '0'); },
  setLen: t => { const i = findPlanItem(ui.timeSheet); if (i) i.dur = +t.dataset.v; },
  clearTime: () => { const i = findPlanItem(ui.timeSheet); if (i) delete i.start; },
  fetchOne: t => { const a = actById(t.dataset.id); t.textContent = 'Fetching…';
    fetchPlacePhotos(a).then(k => { t.textContent = k ? `Added ${k}` : 'Nothing found'; refreshPhotos(); }).catch(() => { t.textContent = 'No internet'; }); return false; },
  fetchAll: t => { fetchAllPhotos(t); return false; },
  exportPhotos: () => { exportPhotos(); return false; },
  city: t => { ui.city = t.dataset.v; },
  mode: t => { ui.mode = t.dataset.v; },
  cat: t => { ui.cat = t.dataset.v; },
  open: t => { ui.scroll = window.scrollY; ui.detail = t.dataset.id; history.pushState({d:1}, ''); window.scrollTo(0, 0); },
  back: () => { history.back(); return false; },
  copyAddr: t => {
    const a = actById(t.dataset.id); if (!a || !a.address) return false;
    (navigator.clipboard ? navigator.clipboard.writeText(a.address) : Promise.reject()).then(() => { t.textContent = 'Copied ✓'; setTimeout(() => t.textContent = 'Copy address', 1200); }).catch(() => {});
    return false;
  },
  makeMain: t => {
    (async () => {
      const id = ui.detail, i = +t.dataset.i, arr = await photosGet(id);
      const [x] = arr.splice(i, 1); arr.unshift(x); await photosSet(id, arr); refreshPhotos();
    })();
    return false;
  },
  delPhoto: t => {
    if (!confirm('Delete this photo?')) return false;
    (async () => {
      const id = ui.detail, arr = await photosGet(id); arr.splice(+t.dataset.i, 1); await photosSet(id, arr);
      const hero = document.getElementById('hero'); if (hero && !arr.length) hero.innerHTML = catIcon(actById(id).cat);
      refreshPhotos();
    })();
    return false;
  },
  addToDay: t => {
    const date = document.getElementById('detailDay').value, id = t.dataset.id;
    (state.plan[date] ||= []).push({id:uid(), actId:id, done:false, booked:false});
    state.saved[id] = true; ui.msg = 'Added to ' + dayLabel(date) + ' in your Plan ✓';
  },
  delCustom: t => {
    if (!confirm('Delete this place?')) return false;
    state.customActs = state.customActs.filter(c => c.id !== t.dataset.id); delete state.saved[t.dataset.id];
    save(); ui.detail = null; history.back(); return false;
  },
  star: t => { const id = t.dataset.id; state.saved[id] ? delete state.saved[id] : state.saved[id] = true; },
  addCustomAct: () => {
    const name = document.getElementById('newActName').value.trim(); if (!name) return false;
    const a = {id:'c'+uid(), city:document.getElementById('newActCity').value, name, when:document.getElementById('newActWhen').value, note:'Added by me'};
    state.customActs.push(a); state.saved[a.id] = true;
  },
  addExp: () => {
    const v = kpVal();
    if (!(v > 0)) { const s = document.getElementById('expConv'); if (s) s.textContent = 'Type an amount first'; return false; }
    const isCOP = state.lastCur === 'COP', note = document.getElementById('expNote').value.trim(), cat = ui.expCat || 'other';
    const sd = spreadDays(), parts = splitAmount(v, sd.length, !isCOP), group = sd.length > 1 ? uid() : undefined;
    const added = sd.map((date, i) => {
      const e = {id: uid(), date, note, cat, pay: state.lastPay || 'card'};
      if (isCOP) Object.assign(e, {cur: 'COP', cop: parts[i]}); else e.amt = parts[i];
      if (group) Object.assign(e, {group, part: i + 1, parts: sd.length});
      return e;
    });
    state.expenses.push(...added);
    ui.expCat = null; ui.kp = ''; ui.spread = 1;
    const label = `${note || catOf(added[0])[1]} · ${isCOP ? copAmt(v) : brl(v)}`;
    showToast(group ? `Added ${label} over ${sd.length} days` : `Added ${label}`, group ? 'group:' + group : added[0].id);
  },
  spread: t => {
    const days = tripDays(), left = days.length - Math.max(0, days.indexOf(document.getElementById('expDate').value));
    ui.spread = Math.max(1, Math.min(left, (ui.spread || 1) + Number(t.dataset.v)));
    document.getElementById('spreadN').textContent = spreadText(); expPreview();
    return false;
  },
  // one tap: the same expense again, on the day chosen in the form
  repeatExp: t => {
    const src = state.expenses.find(x => x.id === t.dataset.id); if (!src) return false;
    const e = Object.assign({}, src, {id: uid(), date: document.getElementById('expDate').value});
    state.expenses.push(e);
    showToast(`Added ${e.note || catOf(e)[1]} · ${e.cur === 'COP' ? copAmt(e.cop) : brl(e.amt)} on ${dayLabel(e.date)}`, e.id);
  },
  addPrepaid: () => {
    const v = parseFloat(document.getElementById('preAmt').value); if (!(v > 0)) return false;
    const e = {id: uid(), prepaid: true, note: document.getElementById('preNote').value.trim(), cat: document.getElementById('preCat').value};
    if (document.getElementById('preCur').value === 'COP') Object.assign(e, {cur: 'COP', cop: v}); else e.amt = v;
    state.expenses.push(e);
  },
  undoExp: t => { const id = t.dataset.id;   // one expense, or "group:<id>" for all parts of a spread cost
    state.expenses = state.expenses.filter(e => id.startsWith('group:') ? e.group !== id.slice(6) : e.id !== id); ui.toast = null; },
  // keypad presses update the amount in place (no redraw)
  kp: t => { kpPress(t.dataset.v); expPreview(); return false; },
  // pick a category in place (no redraw, so a half-typed amount stays)
  setCat: t => {
    ui.expCat = t.dataset.v;
    t.parentElement.querySelectorAll('button').forEach(b => { const on = b === t; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    return false;
  },
  setSplit: t => { ui.split = t.dataset.v; },
  // switch the form's currency in place, so a half-typed amount isn't lost; remembered for next time
  setCur: t => {
    state.lastCur = t.dataset.v; save();
    const isCOP = state.lastCur === 'COP';
    t.parentElement.querySelectorAll('button').forEach(b => { const on = b.dataset.v === state.lastCur; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    if (isCOP && ui.kp) ui.kp = ui.kp.split(',')[0];   // pesos have no cents
    const sp = document.querySelector('.keypad [data-v=","], .keypad [data-v="000"]');
    if (sp) { sp.dataset.v = isCOP ? '000' : ','; sp.textContent = isCOP ? '000' : ','; }
    expPreview();
    return false;
  },
  budgetDay: t => { ui.expDate = t.dataset.v; },
  histDay: t => { ui.expDate = t.dataset.v; setTimeout(() => window.scrollTo({top: 0, behavior: 'smooth'}), 0); },
  setPay: t => {   // in place, so a half-typed amount stays; remembered for next time
    state.lastPay = t.dataset.v; save();
    t.parentElement.querySelectorAll('button').forEach(b => { const on = b === t; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    return false;
  },
  addCash: () => {
    const v = parseFloat(document.getElementById('cashAmt').value); if (!v) return false;
    (state.wallet ||= []).push({id: uid(), date: brazilToday(), amt: v, note: document.getElementById('cashNote').value.trim()});
  },
  delCash: t => { state.wallet = (state.wallet || []).filter(w => w.id !== t.dataset.id); },
  exportCsv: () => { saveFile(`brazil-trip-expenses-${brazilToday()}.csv`, expensesCsv(), 'text/csv'); return false; },
  backup: () => { makeBackup(document.getElementById('bkPhotos').checked); return false; },
  toggleCarry: () => { state.carry = !state.carry; },
  getRate: () => { if (!ui.rateBusy) fetchRate(); return false; },
  resetDayBudget: t => { if (state.dayBudgets) delete state.dayBudgets[t.dataset.v]; },
  matchTrip: () => { state.tripBudget = tripDays().reduce((s, d) => s + dayBudget(d), 0) + state.expenses.filter(e => e.prepaid).reduce((s, e) => s + expBRL(e), 0); },
  delExp: t => { state.expenses = state.expenses.filter(e => e.id !== t.dataset.id); },
  planDay: t => { ui.planDay = t.dataset.v; },
  addPlanSaved: () => { const v = document.getElementById('planPick').value; if (!v) return false; addPlan({actId:v}); },
  addPlanText: () => { const v = document.getElementById('planText').value.trim(); if (!v) return false; addPlan({text:v}); },
  toggleDone: t => { const i = findPlanItem(t.dataset.id); if (i) i.done = !i.done; },
  setStatus: t => { const i = findPlanItem(t.dataset.id); if (i) { i.status = t.dataset.v; i.booked = i.status === 'booked'; } },
  openDoc: t => { ui.docSheet = t.dataset.id; },
  takeSuggest: t => { const i = findPlanItem(t.dataset.id); if (i) i.docId = t.dataset.v; },
  skipSuggest: t => { const i = findPlanItem(t.dataset.id); if (i) (i.noSuggest ||= []).push(t.dataset.v); },
  closeDocSheet: () => { ui.docSheet = null; },
  goDocs: () => { ui.docSheet = null; tab = 'docs'; window.scrollTo(0, 0); },
  goPlanDay: t => { tab = 'plan'; ui.planDay = t.dataset.v; window.scrollTo(0, 0); },
  delPlan: t => { state.plan[ui.planDay] = (state.plan[ui.planDay]||[]).filter(i => i.id !== t.dataset.id); },
  toggleCheck: t => { const d = state.docs.find(x => x.id === t.dataset.id); d.checks[t.dataset.i].d = !d.checks[t.dataset.i].d; },
  addCheck: t => { const v = document.getElementById('chk-'+t.dataset.id).value.trim(); if (!v) return false; state.docs.find(x => x.id === t.dataset.id).checks.push({t:v, d:false}); },
  // a new booking opens straight in the edit sheet; it's only added when you press Save
  addDoc: () => {
    const type = document.getElementById('newDocType').value, title = document.getElementById('newDoc').value.trim() || DOC_TYPES[type].label;
    ui.docEdit = {isNew: true, draft: {id: uid(), type, title, f: {}, conf: '', notes: '', checks: []}};
  },
  editDoc: t => { const d = state.docs.find(x => x.id === t.dataset.id); if (d) ui.docEdit = {id: d.id, draft: structuredClone(d)}; },
  closeDocEdit: () => { ui.docEdit = null; },
  saveDocEdit: () => {
    const e = ui.docEdit; if (!e) return false;
    const dr = e.draft; dr.title = (dr.title || '').trim() || docType(dr).label;
    // keep only fields that belong to the chosen type
    const keys = new Set(docType(dr).fields.map(f => f[0])); dr.f = Object.fromEntries(Object.entries(dr.f || {}).filter(([k, v]) => keys.has(k) && String(v).trim()));
    if (e.isNew) state.docs.push(dr); else state.docs = state.docs.map(d => d.id === e.id ? dr : d);
    ui.docEdit = null;
  },
  delDoc: t => { if (confirm('Delete this booking and its files?')) { state.docs = state.docs.filter(d => d.id !== t.dataset.id); photosSet(attKey(t.dataset.id), []).catch(() => {}); ui.docEdit = null; } else return false; },
  openAtt: t => { openAtt(t.dataset.id, +t.dataset.i); return false; },
  toggleEm: t => { ui.emOpen = !t.parentElement.open; return false; },   // the browser opens/closes it; just remember
  editEm: () => { ui.emEdit = true; ui.emOpen = true; },
  closeEm: () => { ui.emEdit = false; },
  copyEm: t => {
    const v = t.querySelector('.kvv'), shown = v.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(shown) : Promise.reject()).then(() => { v.textContent = 'Copied'; setTimeout(() => v.textContent = shown, 1200); }).catch(() => {});
    return false;
  },
  revealField: t => {
    const at = Date.now(); ui.reveal = {id: t.dataset.id, at};
    setTimeout(() => { if (ui.reveal && ui.reveal.at === at) { ui.reveal = null; if (tab === 'docs' || tab === 'plan') render(); } }, 30000);
  },
  copyField: t => {
    const d = state.docs.find(x => x.id === t.dataset.id); if (!d || !d.f) return false;
    const v = t.querySelector('.kvv'), shown = v.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(shown) : Promise.reject()).then(() => { v.textContent = 'Copied'; setTimeout(() => v.textContent = shown, 1200); }).catch(() => {});
    return false;
  },
  jumpDoc: t => { const el = document.getElementById('doc-' + t.dataset.id); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); return false; },
  copy: t => {
    const d = state.docs.find(x => x.id === t.dataset.id); if (!d) return false;
    const box = document.getElementById('conf-' + d.id); if (box) d.conf = box.value.trim();   // just typed, not saved yet
    if (!d.conf) return false;
    save();
    const lbl = t.querySelector('span') || t, label = lbl.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(d.conf) : Promise.reject()).then(() => { lbl.textContent = 'Copied'; setTimeout(() => lbl.textContent = label, 1200); }).catch(() => {});
    return false;
  },
};

document.getElementById('main').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.tagName === 'INPUT' && t.type !== 'checkbox' || t.tagName === 'SELECT') return;
  const fn = actions[t.dataset.act]; if (!fn) return;
  if (fn(t) === false) return;
  save(); render();
});
// Text boxes and dropdowns save when you finish typing / choose (without redrawing, so the keyboard stays open)
document.getElementById('main').addEventListener('input', e => { const a = e.target.dataset.act; if (a === 'docField') docFieldInput(e.target); else if (a === 'emField') emFieldInput(e.target); });
document.getElementById('main').addEventListener('change', e => {
  const t = e.target, a = t.dataset.act;
  if (a === 'emField') emFieldInput(t);
  else if (a === 'docField') docFieldInput(t);
  else if (a === 'docType' && ui.docEdit) { ui.docEdit.draft.type = t.value; render(); }   // fields already typed are kept in the draft
  else if (a === 'setConf') { state.docs.find(d => d.id === t.dataset.id).conf = t.value.trim(); save(); }
  else if (a === 'setDaily') { state.daily = parseFloat(t.value) || 0; save(); render(); }
  else if (a === 'setRate') { const v = parseFloat(t.value); if (v > 0) { state.rate = v; state.rateInfo = {source: 'manual', date: brazilToday()}; ui.rateMsg = ''; } save(); render(); }
  else if (a === 'setCardFee') { const v = parseFloat(t.value); state.cardFee = v > 0 ? Math.min(20, v) : 0; save(); render(); }
  else if (a === 'setTrip') { const v = parseFloat(t.value); if (v >= 0) state.tripBudget = v; else delete state.tripBudget; save(); render(); }
  else if (a === 'setDayBudget') { const v = parseFloat(t.value); state.dayBudgets = state.dayBudgets || {};
    if (v >= 0) state.dayBudgets[t.dataset.v] = v; else delete state.dayBudgets[t.dataset.v]; save(); render(); }
  else if (a === 'expDate') { ui.expDate = t.value; render(); }
  else if (a === 'setNote') { state.notes[t.dataset.id] = t.value; save(); }
  else if (a === 'docFiles') { if (t.files.length) addDocFiles(t.dataset.id, Array.from(t.files)); t.value = ''; }
  else if (a === 'restoreFile') { if (t.files[0]) restoreBackup(t.files[0]); t.value = ''; }
  else if (a === 'importPhotos') { importPhotos(t.files[0]); t.value = ''; }
  else if (a === 'setDoc') { const i = findPlanItem(t.dataset.id); if (i) { if (t.value) i.docId = t.value; else delete i.docId; } save(); render(); }
  else if (a === 'setWorkS' || a === 'setWorkE') { state.work = Object.assign({s:'10:00', e:'18:00'}, state.work); state.work[a === 'setWorkS' ? 's' : 'e'] = t.value || state.work[a === 'setWorkS' ? 's' : 'e']; save(); render(); }
  else if (a === 'addPhotos') { addPhotos(Array.from(t.files)); t.value = ''; }
});

window.addEventListener('popstate', () => { ui.detail = null; render(); window.scrollTo(0, ui.scroll || 0); });

render();

/* ============ 4. OFFLINE MODE ============
   The service worker (sw.js) saves a copy of the app on your phone so it opens with no signal. */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
